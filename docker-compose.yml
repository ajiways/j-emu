services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jemu
      POSTGRES_PASSWORD: jemu
      POSTGRES_DB: jemu
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jemu-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jemu -d jemu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jemu-pg:
